{{ with .Description | plainify | htmlUnescape -}}
  {{ truncate 30 . -}}
{{ else -}}
  {{ if .IsHome -}}
    {{ with .Site.Params.description | plainify | htmlUnescape -}}
      {{ . -}}
    {{ end -}}
  {{ else -}}
    {{ .Summary | plainify | htmlUnescape | chomp | truncate 30 -}}
  {{ end -}}
{{ end -}}
